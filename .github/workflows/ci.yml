name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/ready && break; sleep 1; done
          docker exec minio mkdir -p /data/test
      - name: Test
        env:
          OBSRV_TEST_S3_ENDPOINT: localhost:9000
          OBSRV_TEST_S3_BUCKET: test
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
      - name: Build
        run: make build-go
      - name: Build the demo app
        working-directory: examples/demo-shop
        run: go vet ./... && go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          missing=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' \
            ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | awk 'NF<2 {print $1}')
          if [ -n "$missing" ]; then echo "Commits missing sign-off:"; echo "$missing"; exit 1; fi
