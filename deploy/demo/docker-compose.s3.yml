# Variant of the demo that stores telemetry in a MinIO bucket instead of
# the local disk, as obsrv would with AWS S3 or any S3-compatible service.
#
#   docker compose -f deploy/demo/docker-compose.yml -f deploy/demo/docker-compose.s3.yml up --build -d
#   open http://localhost:8080 (obsrv) and http://localhost:9001 (MinIO console, minioadmin/minioadmin)
services:
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/telemetry"

  obsrv:
    depends_on:
      create-bucket:
        condition: service_completed_successfully
    environment:
      OBSRV_STORAGE: s3
      OBSRV_S3_ENDPOINT: minio:9000
      OBSRV_S3_BUCKET: telemetry
      OBSRV_S3_PREFIX: obsrv
      OBSRV_S3_INSECURE: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin

volumes:
  minio-data:
